<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Explore</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            -webkit-touch-callout: none;
        }
        body {
            background-color: #f0f2f5;
            font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px 12px 20px 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        .hub-matrix {
            overflow: hidden;
            margin-bottom: 14px;
        }
        .hub-card {
            float: left;
            width: 50%;
            padding: 0 6px;
            box-sizing: border-box;
            text-decoration: none;
            color: #4a4e54;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: -0.2px;
        }
        .hub-card-inner {
            background-color: #ffffff;
            border: 1px solid #e1e3e6;
            border-radius: 5px;
            height: 94px;
            display: inline-block;
            width: 100%;
            text-align: center;
            vertical-align: middle;
            box-shadow: 0 1px 1px rgba(0,0,0,0.02);
            padding-top: 10px;
        }
        .hub-card:first-child {
            padding-left: 0;
        }
        .hub-card:last-child {
            padding-right: 0;
        }
        .hub-card:active .hub-card-inner {
            background-color: #f9fafb;
        }

        .hub-vector {
            height: 32px;
            margin-bottom: 5px;
            display: block;
            text-align: center;
        }
        .hub-vector img {
            height: 28px;
            width: auto;
            display: block;
            margin: 0 auto;
        }
        .hub-vector span {
            font-size: 26px;
            display: none;
        }

        .color-star { color: #f9a825; }
        .color-arrow { color: #5ac8fa; }

        .section-label {
            color: #92969c;
            font-size: 13px;
            text-align: center;
            margin: 14px 0 10px 0;
            font-weight: normal;
        }

        .channel-stack {
            overflow: hidden;
        }
        .channel-row {
            display: block;
            height: 72px;
            border-radius: 5px;
            padding: 0 16px;
            text-decoration: none;
            color: #ffffff;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: -0.3px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            margin-bottom: 10px;
        }
        .channel-row:active {
            opacity: 0.92;
        }

        .icon-frame {
            margin-right: 15px;
            width: 44px;
            height: 44px;
            display: block;
            float: left;
            text-align: center;
            line-height: 44px;
            margin-top: 14px;
        }
        .icon-frame img {
            width: 34px;
            height: 34px;
            display: block;
            margin: 5px auto 0;
        }
        .icon-frame span {
            font-size: 30px;
            display: none;
            line-height: 44px;
            text-align: center;
        }
        .channel-text {
            line-height: 72px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-classics  { background-color: #00bf8f; }
        .channel-animals   { background-color: #4a89dc; }
        .channel-art       { background-color: #9b59b6; }
        .channel-comedy    { background-color: #ed5565; }
        .channel-diy       { background-color: #4ecdc4; }
        .channel-scitech   { background-color: #ec87c0; }
        .channel-style     { background-color: #f5b041; }
        .channel-family    { background-color: #72d072; }

        .clearfix:after {
            content: ".";
            display: block;
            height: 0;
            clear: both;
            visibility: hidden;
        }
        .clearfix { display: inline-block; }
        .clearfix { display: block; }
    </style>
</head>
